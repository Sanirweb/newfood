# ============================================
# Application Configuration
# Java 25 + Spring Boot 4.1.1
# ============================================
spring.application.name=food-delivery-backend

# Server Configuration
server.port=8080

# ============================================
# H2 Database Configuration (In-Memory)
# ============================================
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (accessible at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================
# JPA / Hibernate 7.x Configuration
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# Spring Boot Actuator
# ============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
# Liveness and readiness probes enabled by default in Spring Boot 4
management.endpoint.health.probes.enabled=true

# ============================================
# SpringDoc OpenAPI 3.x (Swagger UI)
# ============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ============================================
# Jackson 3 Configuration (Spring Boot 4 default)
# ============================================
# Use Jackson 3 defaults (Spring Boot 4 uses Jackson 3 by default)
# If you need Jackson 2 compatibility, set: spring.jackson.use-jackson2-defaults=true

# ============================================
# Logging
# ============================================
logging.level.com.fooddelivery=DEBUG
logging.level.org.springframework.web=DEBUG
